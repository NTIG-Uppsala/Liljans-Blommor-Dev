name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
defaults:
      run:
        working-directory: ./
jobs:
  setup:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: .\playwright\
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        name: Run installation script
        run: ./setupScript.sh
      env:
        ENVIRONMENT: "DEV"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./playwright
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        name: Run installation script
        run: ./setupScript.sh
    - name: Run Playwright tests
      run: npx playwright test
      env:
        ENVIRONMENT: "DEV"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
