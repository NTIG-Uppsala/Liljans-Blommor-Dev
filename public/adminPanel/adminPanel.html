<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adminpanel</title>

    <link rel="stylesheet" href="adminPanel.css">

</head>

<body>

    <main class="admin-panel">

        <h1>Adminpanel</h1>

        <p class="description">
            Ändra information som visas på webbplatsen.
        </p>


        <section class="form-section">

            <label for="dataType">
                1. Vad vill du ändra?
            </label>

            <select id="dataType">

                <option value="">
                    -- Välj --
                </option>

                <option value="products">
                    Produkter
                </option>

                <option value="contacts">
                    Kontaktuppgifter
                </option>

                <option value="openingHours">
                    Öppettider
                </option>

                <option value="postalCodes">
                    Postnummer
                </option>

            </select>

        </section>


        <section class="form-section hidden" id="categorySection">

            <label for="category">
                2. Välj kategori
            </label>

            <select id="category">

                <option value="">
                    -- Välj kategori --
                </option>

            </select>

        </section>


        <section class="form-section hidden" id="productActionSection">

            <label for="productAction">
                3. Vad vill du göra?
            </label>

            <select id="productAction">

                <option value="">
                    -- Välj --
                </option>

                <option value="edit">
                    Ändra produkt
                </option>

                <option value="add">
                    Lägg till produkt
                </option>

                <option value="remove">
                    Ta bort produkt
                </option>

            </select>

        </section>


        <section class="form-section hidden" id="itemSection">

            <label for="item">
                4. Välj produkt
            </label>

            <select id="item">

                <option value="">
                    -- Välj produkt --
                </option>

            </select>

        </section>


        <section class="form-section hidden" id="propertySection">

            <label for="property">
                5. Vad vill du ändra?
            </label>

            <select id="property">

                <option value="">
                    -- Välj värde --
                </option>

                <option value="name">
                    Namn
                </option>

                <option value="price">
                    Pris
                </option>

                <option value="isBestSeller">
                    Bästsäljare
                </option>

                <option value="isShowcase">
                    Visa på startsida
                </option>

                <option value="img">
                    Bild
                </option>

            </select>

        </section>


        <section class="form-section hidden" id="valueSection">

            <label for="newValue">
                6. Nytt värde
            </label>

            <input type="text" id="newValue" placeholder="Skriv det nya värdet...">

            <button type="button" id="saveButton">
                Spara ändring
            </button>

        </section>


        <section class="form-section hidden" id="newProductSection">

            <h2>Ny produkt</h2>

            <p class="section-description">
                Fyll i alla uppgifter för den nya produkten.
            </p>


            <div class="new-product-field">

                <label for="newProductName">
                    Namn
                </label>

                <input type="text" id="newProductName" placeholder="Exempel: Rosbukett">


            </div>


            <div class="new-product-field">

                <label for="newProductPrice">
                    Pris
                </label>

                <input type="test" id="newProductPrice" placeholder="Exempel: 299" min="0" inputmode="numeric"
                    oninput="this.value = this.value.replace(/[^0-9\s]/g, '')" required>


            </div>


            <div class="new-product-field">

                <label for="newProductBestSeller">
                    Bästsäljare
                </label>

                <select id="newProductBestSeller">

                    <option value="false">
                        Nej
                    </option>

                    <option value="true">
                        Ja
                    </option>

                </select>

            </div>


            <div class="new-product-field">

                <label for="newProductShowcase">
                    Visa på produktsida
                </label>

                <select id="newProductShowcase">

                    <option value="false">
                        Nej
                    </option>

                    <option value="true">
                        Ja
                    </option>

                </select>

            </div>


            <div class="new-product-field">

                <label for="newProductImage">
                    Bild
                </label>

                <input type="text" id="newProductImage" placeholder="../assets/images/example.jpg">

            </div>


            <button type="button" id="saveNewProductButton">
                Lägg till produkt
            </button>

        </section>


        <section class="form-section hidden" id="removeProductSection">

            <div class="warning-box">

                <strong>Observera</strong>

                <p>
                    När du tar bort en produkt tas hela produkten
                    bort från kategorin.
                </p>

            </div>

            <button type="button" id="removeProductButton" class="danger-button">
                Ta bort produkt
            </button>

        </section>


        <section class="preview hidden" id="preview">

            <h2>Ändring</h2>


            <div class="preview-row">

                <span>
                    Fil
                </span>

                <strong id="previewFile"></strong>

            </div>


            <div class="preview-row">

                <span>
                    Kategori
                </span>

                <strong id="previewCategory"></strong>

            </div>


            <div class="preview-row">

                <span>
                    Objekt
                </span>

                <strong id="previewItem"></strong>

            </div>


            <div class="preview-row">

                <span>
                    Gammalt värde
                </span>

                <strong id="previewOldValue"></strong>

            </div>


            <div class="preview-row">

                <span>
                    Nytt värde
                </span>

                <strong id="previewNewValue"></strong>

            </div>


            <div class="preview-buttons">

                <button type="button" id="cancelButton">
                    Avbryt
                </button>


                <button type="button" id="confirmButton">
                    Bekräfta ändring
                </button>

            </div>

        </section>

        <p id="message" class="message"></p>



        <div id="temp_debugging"></div>
    </main>




    <script src="adminPanel.js"></script>

</body>

</html>
