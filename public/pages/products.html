<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liljans Blommor</title>
    <link rel="icon" href="../assets/favicon/icon.svg">
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>
    <header>
        <div class="top-header">
            <h1>Liljans Blommor</h1>
            <h1 id="tel">Tel: <span class="tel">Laddar...</span></h1>
        </div>

        <div class="sub-header">
            <nav>
                <a class="navBarText" href="../pages/index.html">Startsida</a>
                <a class="navBarText" href="../pages/products.html">Produkter</a>
                <a class="navBarText" href="../pages/contact.html">Kontakt</a>
                <a class="navBarText" href="../pages/aboutus.html">Om oss</a>
            </nav>
        </div>
    </header>


    <main>
        <h2>Våra Produkter</h2>
        <div class="sub-main">
            <div id="gallery" data-page="productsPage">
                <img id="loading" src="../assets/gifs/loading.gif" alt="">
            </div>
            <table id="productTable">
            </table>
            <label class="toggle">
                <input type="checkbox" id="taxToggle">
                <span class="option incl">Inklusive moms</span>
                <span class="option excl">Exklusive moms</span>
                <span class="slider"></span>
            </label>
        </div>

        <div id="flowerDeliveryTitleContainer">

            <h2>Blommogram</h2>

        </div>

        <section class="flowerDelivery">

            <h3>Postnummer</h3>

            <label class="addressInput" for="postalCode">
                <span class="locationIcon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path>
                        <circle cx="12" cy="9" r="2.5"></circle>
                    </svg>
                </span>

                <input type="text" id="postalCode" name="postalCode" placeholder="95959" inputmode="numeric"
                    autocomplete="postal-code" maxlength="5" pattern="[0-9]{5}"
                    oninput="this.value = this.value.replace(/[^0-9 ]/g, '')" required>
            </label>

            <div id="flowerDeliveryAvailableBox">

            </div>
        </section>

    </main>


    <footer>
        <h2>Liljans Blommor</h2>
        <div class="sub-footer">
            <div>
                <b>Kontakt</b>
                <ul>
                    <li>Tel: <span class="tel">Laddar...</span></li>
                    <li>E-post: <span class="mail">Laddar...</span></li>
                </ul>
            </div>
            <div>
                <b>Adress</b>
                <ul>
                    <li class="location">Laddar...</li>
                </ul>
            </div>
            <div>
                <b>Öppettider</b>
                <ul>
                    <li class="weekdays">Laddar...</li>
                    <li class="saturday">Laddar...</li>
                    <li class="sunday">Laddar...</li>
                </ul>
            </div>
        </div>
    </footer>


    <script src="../scripts/script.js"></script>
    <script src="../scripts/productsScript.js"></script>
    <script src="../scripts/taxToggle.js"></script>
    <script src="../scripts/flowerDelivery.js"></script>
</body>

</html>
