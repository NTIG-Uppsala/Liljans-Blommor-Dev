<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liljans Blommor</title>
    <link rel="icon" href="../assets/favicon/icon.svg">

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header></header>

    <main>

        <h2>Välkommen till<br>
            Liljans Blommor
        </h2>

        <h3>Öppettider
            <p class="noMargin weekdays">Laddar...</p>
            <p class="noMargin saturday">Laddar...</p>
            <p class="noMargin sunday">Laddar...</p>
        </h3>

        <div class="sub-main">


            <h1>Bästsäljare</h1>

            <div id="gallery" data-page="indexPage">

                <img id="loading" src="../assets/gifs/loading.gif" alt="Loading...">

            </div>
            <div class="products-button">
                <a href="products.html">Gå till produkter</a>
            </div>


            <div class="toggleContainer">
                <label class="toggle">
                    <input type="checkbox" id="taxToggle">
                    <span class="option incl">Inklusive moms</span>
                    <span class="option excl">Exklusive moms</span>
                    <span class="slider"></span>
                </label>
            </div>


        </div>
    </main>

    <footer></footer>

    <script src="../scripts/script.js"></script>
    <script src="../scripts/indexScript.js"></script>
    <script src="../scripts/taxToggle.js"></script>
    <script src="../scripts/components.js"></script>

    <script>
        loadComponent("header", "../components/header.html");
        loadComponent("footer", "../components/footer.html");
    </script>


</body>

</html>
